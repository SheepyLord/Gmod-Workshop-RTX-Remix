name: Bug report
description: Something in the RTX Remix loader or the Workshop package does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. With the steps, the diagnostics and a screenshot or the logs, a problem can usually be found and fixed; without them we have to ask for them first.

        Common start-up and performance problems are answered in the [README's troubleshooting table](https://github.com/SheepyLord/Gmod-Workshop-RTX-Remix#troubleshooting) and on the Troubleshooting page of the in-game guide (console: `nativeloader_guide`).
  - type: checkboxes
    id: checks
    attributes:
      label: Before you report
      description: >-
        The RTX package is the [RTX Remix Workshop item](https://steamcommunity.com/sharedfiles/filedetails/?id=3829070317),
        the loader's newest `winmm.dll` is on the
        [latest release](https://github.com/SheepyLord/Gmod-Workshop-RTX-Remix/releases/latest) page, and earlier reports
        are in the [open and closed issues](https://github.com/SheepyLord/Gmod-Workshop-RTX-Remix/issues?q=is%3Aissue).
      options:
        - label: Garry's Mod is on the x86-64 beta branch (in Steam, Garry's Mod > Properties > Betas).
          required: true
        - label: I'm subscribed to the RTX Remix Workshop item, and my bin\win64\winmm.dll is from the latest release.
          required: true
        - label: I searched the open and closed issues, and this problem is not reported yet.
          required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem is it?
      options:
        - Installing, updating or starting the game
        - A crash, a freeze or a load that never ends
        - Something looks wrong (graphics, materials, lights, sky or the HUD)
        - Frame rate, stutter, lag or memory
        - Another add-on breaks or misbehaves with RTX
        - The RTX Remix tab or one of its tools (PBR, Model Hotloader, material editor and others)
        - VR
        - Multiplayer
        - Something else
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead. If a message appeared, copy its text here.
      placeholder: When I spawn a chair on gm_construct, it turns bright white. I expected its wood texture.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: >-
        Start from launching the game, so we can make it happen ourselves. Name the map and the add-ons, characters or
        tools involved, and say how often it happens.
      placeholder: |
        1. Start Garry's Mod and load gm_construct in single-player.
        2. Open the spawn menu and spawn ...
        3. ...
        It happens every time.
    validations:
      required: true
  - type: dropdown
    id: addons
    attributes:
      label: Does it happen without your other add-ons?
      description: >-
        Disable every other add-on, keep the RTX Remix item, and try again. Then we know whether another add-on is
        part of it.
      options:
        - Yes, it happens with only the RTX Remix item enabled
        - No, only together with other add-ons (name them below)
        - I haven't tried
    validations:
      required: true
  - type: textarea
    id: addon-list
    attributes:
      label: Add-ons and Remix mods involved
      description: >-
        Names or Workshop links of the add-ons it happens with, and any RTX Remix mods you put into `rtx-remix\mods`
        yourself.
  - type: textarea
    id: media
    attributes:
      label: Screenshots or video
      description: >-
        For anything you see on screen, a screenshot or a short video shows it best. Drag the files into this box
        (images and videos up to 10 MB each). Steam takes a screenshot with F12.
  - type: textarea
    id: diagnostics
    attributes:
      label: RTX Remix diagnostics
      description: >-
        In Garry's Mod's main menu, the **RTX Remix diagnostics** panel at the bottom right has a
        **Copy diagnostics** button. Click it and paste the text here. It lists your system, graphics card, game branch,
        loader and package. If the game never reaches the main menu, write that here and attach
        `native-loader\logs\loader.log` under Logs.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        The paths start in your Garry's Mod folder, the one with `gmod.exe`. GitHub takes files up to 25 MB: please zip a folder before you attach it, and share a bigger one through a file host with a link.

        - **The game crashed or closed:** the message after the crash names its folder in `SteamLibrary\steamapps\common\GarrysMod\native-loader\logs\sessions`. Zip the newest one there and attach it: it holds Remix's log and the crash dump.
        - **Anything else:** `native-loader\logs\loader.log` and `rtx-remix\logs\remix-dxvk.log`, before you start the game again (the next start replaces them).
        - **Lag or stutter:** while it lags, type `nativeloader_lag_report` in the console, wait ten seconds, then attach `garrysmod\data\nativeloader\lag_report_client.txt` and `lag_report_server.txt`.
        - **Stuck at "Starting Lua":** after 90 seconds the game shows a message that names an add-on file. Attach `garrysmod\data\native-loader\startup-stall.json`.

        Logs and crash dumps can hold your Windows user name, your Steam name and parts of the game's memory: look through what you share.
      placeholder: Drag the files here.
